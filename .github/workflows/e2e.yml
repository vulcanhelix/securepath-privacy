name: e2e

# Full-stack e2e on every PR and push to main: ephemeral Supabase (compose from
# staging/), all migrations applied in order, Next.js built + served, Caddy
# path-routing one origin — then both suites over real HTTP exactly like prod.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: POPIA 2026 pack parity (zip vs migration)
        run: python3 app/tests/test_popia_2026_pack_parity.py

      - name: CI workflow self-check (every SQL suite runs once, asserts PASS)
        run: python3 app/tests/check_ci_workflow.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate throwaway secrets + JWTs
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          echo "ANON_KEY=$(python3 ci/mint_jwt.py "$JWT_SECRET" anon)" >> "$GITHUB_ENV"
          echo "SERVICE_KEY=$(python3 ci/mint_jwt.py "$JWT_SECRET" service_role)" >> "$GITHUB_ENV"


      - name: Start Supabase stack (db, auth, rest, minio)
        working-directory: staging
        run: |
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "MINIO_ROOT_USER=ci-minio"
            echo "MINIO_ROOT_PASSWORD=ci-$POSTGRES_PASSWORD"
          } > .env
          # db first: a fresh supabase/postgres init leaves the internal service roles
          # (supabase_auth_admin, authenticator, supabase_storage_admin) with NO password,
          # so GoTrue/PostgREST would fail SASL auth. Set them before those services start.
          docker compose up -d --wait db minio
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE supabase_auth_admin WITH PASSWORD '$POSTGRES_PASSWORD';
             ALTER ROLE authenticator WITH PASSWORD '$POSTGRES_PASSWORD';
             ALTER ROLE supabase_storage_admin WITH PASSWORD '$POSTGRES_PASSWORD';"
          docker compose up -d --wait

      - name: Apply all migrations in order
        run: |
          for f in app/supabase/migrations/*.sql; do
            echo "== $f"
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
              psql -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U supabase_admin -d postgres < "$f"
          done

      - name: Role-assignments predicate checks (W0-00)
        run: |
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_role_assignments.sql 2>&1 | tee /tmp/ra_checks.log
          ! grep -q "FAIL" /tmp/ra_checks.log
          grep -q "PASS" /tmp/ra_checks.log

      - name: Template-engine checks (W0-03)
        run: |
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_template_engine.sql 2>&1 | tee /tmp/te_checks.log
          ! grep -q "FAIL" /tmp/te_checks.log
          grep -q "PASS" /tmp/te_checks.log

      - name: Rules-engine checks (W1-01)
        run: |
          # The W0-05 fixture pack is opt-in: it no-ops unless the session has
          # securepath.test_fixtures=on (see the file's gate). Enable + apply
          # in ONE psql session — the migrations loop above already ran it as
          # a no-op — then run the suite.
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_rules_engine.sql 2>&1 | tee /tmp/re_checks.log
          ! grep -q "FAIL" /tmp/re_checks.log
          grep -q "PASS" /tmp/re_checks.log
      - name: Ops-CRUD checks (W1-06)
        run: |
          # the W0-05 fixture pack is a no-op without the opt-in GUC — enable it
          # on this throwaway DB, (re)apply the pack, then run the checks
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE postgres SET securepath.test_fixtures = 'on'"
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < app/supabase/migrations/20261105000005_test_fixtures.sql
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_ops_crud.sql 2>&1 | tee /tmp/ops_checks.log
          ! grep -q "FAIL" /tmp/ops_checks.log
          grep -q "PASS" /tmp/ops_checks.log

      - name: Licences + support-grant checks (W1-07)
        run: |
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_licences_grants.sql 2>&1 | tee /tmp/lic_checks.log
          ! grep -q "FAIL" /tmp/lic_checks.log
          grep -q "PASS" /tmp/lic_checks.log

      - name: Programme-lifecycle checks (W1-05)
        run: |
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_programme_lifecycle.sql 2>&1 | tee /tmp/pl_checks.log
          ! grep -q "FAIL" /tmp/pl_checks.log
          grep -q "PASS" /tmp/pl_checks.log

      - name: Support-access checks (W4-01)
        run: |
          # same-session GUC + fixture (re)apply so the suite sees a clean
          # TESTFIX world regardless of what earlier steps mutated
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -q -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_support_access.sql 2>&1 | tee /tmp/sa_checks.log
          ! grep -q "FAIL" /tmp/sa_checks.log
          grep -q "PASS" /tmp/sa_checks.log

      - name: W1 follow-up checks (FR-WKS-03, attendees, #81/#82/#83)
        run: |
          # self-contained: seeds and tears down its own W1FU namespace
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_followups.sql 2>&1 | tee /tmp/fu_checks.log
          ! grep -q "FAIL" /tmp/fu_checks.log
          grep -q "PASS" /tmp/fu_checks.log

      - name: Platform-admin checks (W2-14)
        run: |
          # self-contained: seeds and tears down its own W214 namespace
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_platform_admin.sql 2>&1 | tee /tmp/pa_checks.log
          ! grep -q "FAIL" /tmp/pa_checks.log
          grep -q "PASS" /tmp/pa_checks.log

      - name: Notification fan-out checks (W1-08)
        run: |
          # same TESTFIX world as the ops-CRUD step (fixture pack is re-runnable)
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_notifications.sql 2>&1 | tee /tmp/notif_checks.log
          ! grep -q "FAIL" /tmp/notif_checks.log
          grep -q "PASS" /tmp/notif_checks.log

      - name: Ops-registers checks (W1-04)
        run: |
          # same-session GUC + fixture (re)apply, then the W1-04 suite —
          # mirrors the W1-01 step (the ops registers need the rules engine
          # already applied, which the migrations loop guarantees).
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_ops_registers.sql 2>&1 | tee /tmp/or_checks.log
          ! grep -q "FAIL" /tmp/or_checks.log
          grep -q "PASS" /tmp/or_checks.log
      - name: Cadence checks (W1-03)
        run: |
          # fixture world is already opted-in + seeded by the ops-crud step;
          # re-apply it so this step is independent of ops-crud's mutations
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_cadence.sql 2>&1 | tee /tmp/cad_checks.log
          ! grep -q "FAIL" /tmp/cad_checks.log
          grep -q "PASS" /tmp/cad_checks.log

      - name: Evidence-chain checks (W1-02)
        run: |
          # the W0-05 TESTFIX fixture world is gated behind the custom GUC —
          # apply it in the same session as the suite (wipe-and-reseed, safe
          # on this ephemeral db only)
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql \
                app/tests/e2e_evidence_chain.sql; } \
          | docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
              psql -h 127.0.0.1 -U supabase_admin -d postgres 2>&1 | tee /tmp/ec_checks.log
          ! grep -q "FAIL" /tmp/ec_checks.log
          grep -q "PASS" /tmp/ec_checks.log

      - name: Report-builder checks (W2-08)
        run: |
          # self-contained: seeds and tears down its own W208 namespace
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_report_builder.sql 2>&1 | tee /tmp/rb_checks.log
          ! grep -q "FAIL" /tmp/rb_checks.log
          grep -q "PASS" /tmp/rb_checks.log

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          APP_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npm run test:report
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Start web + Caddy
        run: |
          cd web/.next/standalone
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:8080 \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          APP_URL=http://127.0.0.1:8080 \
          S3_ENDPOINT=http://127.0.0.1:9000 S3_ACCESS_KEY=ci-minio S3_SECRET_KEY="ci-$POSTGRES_PASSWORD" \
          S3_FORCE_PATH_STYLE=true S3_BUCKET=securepath-documents \
          PORT=3200 HOSTNAME=127.0.0.1 nohup node server.js > /tmp/next.log 2>&1 &
          docker run -d --name ci-caddy --network host \
            -v "$PWD/../../../ci/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/login && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/login

      - name: Browser suite — Playwright (W4-00)
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ANON_KEY: ${{ env.ANON_KEY }}
          E2E_SERVICE_KEY: ${{ env.SERVICE_KEY }}
        run: |
          # Fresh TESTFIX world in the same session as its opt-in GUC (wipe +
          # reseed) so this suite never depends on what earlier steps mutated.
          { echo "SET securepath.test_fixtures='on';";
            cat ../app/supabase/migrations/20261105000005_test_fixtures.sql; } | \
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -q -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Isolation suite (22 checks)
        env:
          SUPABASE_URL: http://127.0.0.1:8080
        run: |
          ANON_KEY="$ANON_KEY" SERVICE_KEY="$SERVICE_KEY" python3 app/tests/e2e_isolation.py

      - name: Pipeline suite (Stages 0-6 + gates)
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_KEY" python3 app/tests/e2e_pipeline.py

      - name: Scheduler checks (W1-09)
        run: |
          # seed the W0-05 TESTFIX world for the scheduler suite (flag-gated;
          # the migration loop applied it as a no-op with the flag off)
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "ALTER DATABASE postgres SET securepath.test_fixtures='on';"
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/supabase/migrations/20261105000005_test_fixtures.sql
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_scheduler.sql 2>&1 | tee /tmp/sch_checks.log
          ! grep -q "FAIL" /tmp/sch_checks.log
          grep -q "PASS" /tmp/sch_checks.log

      - name: Tracks-programmes bridge checks (W0-04)
        run: |
          # suite is self-contained (own W004 namespace, never touches TESTFIX);
          # the fixture pack is (re)applied in the same session only so the
          # chain matches the other steps. Runs after the pipeline suite, which
          # already proved the old Stage 0-6 flow green with the bridge applied.
          { echo "SET securepath.test_fixtures='on';";
            cat app/supabase/migrations/20261105000005_test_fixtures.sql \
                app/tests/e2e_tracks_bridge.sql; } \
          | docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
              psql -h 127.0.0.1 -U supabase_admin -d postgres 2>&1 | tee /tmp/tb_checks.log
          ! grep -q "FAIL" /tmp/tb_checks.log
          grep -q "PASS" /tmp/tb_checks.log
          grep -c "PASS" /tmp/tb_checks.log

      - name: Register-integrity checks (#87)
        run: |
          # self-contained (own W1RI namespace, never touches TESTFIX): §9.4
          # closure refs must be accepted, linked, same-programme evidence on
          # every write path, plus the register RPCs (create/update/link/
          # reopen/retire). Wipes + tears down its namespace — re-runnable.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_register_integrity.sql 2>&1 | tee /tmp/ri_checks.log
          ! grep -q "FAIL" /tmp/ri_checks.log
          grep -q "PASS" /tmp/ri_checks.log

      - name: Documents, training + designations checks (W2-12)
        run: |
          # self-contained (own W2DT namespace + test jurisdiction pack, never
          # touches TESTFIX): FR-DOC-01 versioned register + NFR-09 issued
          # immutability, FR-TRN-01 records (void-and-re-record), FR-ACC-03
          # designation appoint/end gates and the is_ao_or_alternate effect.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" securepath-staging-db-1 \
            psql -h 127.0.0.1 -U supabase_admin -d postgres \
            < app/tests/e2e_docs_training.sql 2>&1 | tee /tmp/dt_checks.log
          ! grep -q "FAIL" /tmp/dt_checks.log
          grep -q "PASS" /tmp/dt_checks.log

      - name: Logs on failure
        if: failure()
        run: |
          tail -50 /tmp/next.log || true
          docker logs securepath-staging-auth-1 2>&1 | tail -30 || true
          docker logs securepath-staging-rest-1 2>&1 | tail -20 || true
          docker logs securepath-staging-minio-1 2>&1 | tail -20 || true
