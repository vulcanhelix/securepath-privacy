<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Essentials SA — Self-Assessment</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg:        #0b0f1a;
  --surface:   #111827;
  --card:      #161e2e;
  --border:    #1f2d47;
  --accent:    #00c2a8;
  --accent2:   #3b82f6;
  --warn:      #f59e0b;
  --danger:    #ef4444;
  --success:   #22c55e;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --dim:       #94a3b8;
  --radius:    10px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1f2d47;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2d3f5c}

/* ── LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:260px;min-width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:all .3s}
#sidebar.collapsed{width:56px;min-width:56px}

.sid-logo{padding:18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sid-logo .mark{width:32px;height:32px;min-width:32px;background:linear-gradient(135deg,var(--accent),#0097a7);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sid-logo .name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent);line-height:1.2;white-space:nowrap;overflow:hidden}
.sid-logo .sub{font-size:10px;color:var(--muted)}
.collapse-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px;min-width:20px}

.sid-progress{padding:12px 14px;border-bottom:1px solid var(--border)}
.sid-progress .prog-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;justify-content:space-between}
.sid-progress .prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sid-progress .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s}

.sid-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:10px 14px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .2s;position:relative}
.nav-item:hover{background:rgba(0,194,168,.06);color:var(--accent)}
.nav-item.active{background:rgba(0,194,168,.1);border-left-color:var(--accent);color:var(--accent)}
.nav-item .ni-icon{font-size:16px;min-width:20px;text-align:center}
.nav-item .ni-text{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item .ni-pct{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:var(--muted)}
.nav-item.active .ni-pct{color:var(--accent)}
.nav-mini-bar{height:2px;background:var(--border);border-radius:1px;margin:1px 14px 0;overflow:hidden}
.nav-mini-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .3s}

.sid-foot{padding:10px 12px;border-top:1px solid var(--border)}
.sid-save-row{display:flex;gap:6px;margin-bottom:8px}
.sid-btn{flex:1;padding:7px 4px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.sid-btn:hover{border-color:var(--accent);color:var(--accent)}
.sid-reg{font-size:9px;color:#253040;line-height:1.5;text-align:center}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.topbar h1{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text)}
.topbar .tb-badge{font-size:10px;padding:3px 10px;border-radius:20px;background:rgba(0,194,168,.15);color:var(--accent);border:1px solid rgba(0,194,168,.3);font-weight:600;letter-spacing:.3px}
.topbar .tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.topbar .tb-tier{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topbar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:11px;font-family:inherit;cursor:pointer;outline:none}

.content{flex:1;overflow-y:auto;padding:24px 28px 40px}

/* ── VIEW TABS ── */
.view-tabs{display:flex;gap:0;background:var(--card);border-radius:9px;padding:3px;width:fit-content;margin-bottom:22px;border:1px solid var(--border)}
.vtab{padding:7px 18px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.vtab.active{background:var(--accent2);color:#fff}
.vtab:hover:not(.active){color:var(--text)}

/* ── SECTION CARDS ── */
.section-intro{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;border-left:3px solid var(--accent)}
.section-intro h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text)}
.section-intro p{font-size:12px;color:var(--muted);line-height:1.6}
.sa-note{display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:5px;padding:3px 10px;font-size:10px;color:var(--warn);margin-top:8px;font-weight:600}

/* ── QUESTIONS ── */
.q-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;transition:border-color .2s;overflow:hidden}
.q-block.answered{border-color:rgba(34,197,94,.3)}
.q-block.flagged{border-color:rgba(245,158,11,.4)}

.q-header{padding:14px 18px;display:flex;align-items:flex-start;gap:12px;cursor:default}
.q-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);background:rgba(0,194,168,.1);border:1px solid rgba(0,194,168,.2);border-radius:5px;padding:2px 8px;white-space:nowrap;margin-top:1px;min-width:48px;text-align:center}
.q-text{flex:1;font-size:13px;color:var(--text);line-height:1.55;font-weight:500}
.q-req{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;margin-top:2px}
.q-req.req-core{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.q-req.req-high{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
.q-req.req-std{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}

.q-body{padding:0 18px 16px 18px}
.q-guidance{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:6px;border-left:2px solid var(--border)}
.q-sa-context{font-size:11px;color:rgba(245,158,11,.9);background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.15);border-radius:6px;padding:8px 12px;margin-bottom:12px;line-height:1.5}
.q-sa-context::before{content:'🇿🇦 SA Context: ';font-weight:700}

/* Answer types */
.ans-yesno{display:flex;gap:10px}
.yn-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.yn-btn:hover{border-color:var(--muted);color:var(--text)}
.yn-btn.sel-yes{background:rgba(34,197,94,.15);border-color:var(--success);color:var(--success)}
.yn-btn.sel-no{background:rgba(239,68,68,.12);border-color:var(--danger);color:#f87171}
.yn-btn.sel-na{background:rgba(100,116,139,.15);border-color:var(--muted);color:var(--muted)}

textarea.ans-notes{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;padding:10px 13px;resize:vertical;min-height:72px;line-height:1.6;outline:none;transition:border-color .2s}
textarea.ans-notes:focus{border-color:var(--accent2)}
textarea.ans-notes::placeholder{color:var(--muted)}

.ans-multi{display:flex;flex-direction:column;gap:7px}
.mc-opt{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.mc-opt:hover{border-color:var(--muted);background:rgba(255,255,255,.02)}
.mc-opt.selected{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.4)}
.mc-opt input{accent-color:var(--accent2);width:14px;height:14px;cursor:pointer}
.mc-opt label{font-size:12px;color:var(--dim);cursor:pointer;flex:1}
.mc-opt.selected label{color:var(--text)}

.ans-options{display:flex;flex-direction:column;gap:7px}
.opt-btn{padding:9px 13px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;text-align:left;transition:all .2s;line-height:1.4}
.opt-btn:hover{border-color:var(--muted);color:var(--text)}
.opt-btn.selected{background:rgba(0,194,168,.1);border-color:rgba(0,194,168,.4);color:var(--accent)}

.q-flag{margin-top:12px;display:flex;align-items:center;gap:6px}
.flag-btn{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;transition:color .2s}
.flag-btn:hover{color:var(--warn)}
.flag-btn.flagged{color:var(--warn)}
.q-comment{margin-top:8px}
.q-comment textarea{width:100%;background:var(--surface);border:1px solid rgba(245,158,11,.25);border-radius:6px;color:var(--warn);font-size:11px;font-family:inherit;padding:8px 11px;resize:vertical;min-height:50px;outline:none}
.q-comment textarea::placeholder{color:rgba(245,158,11,.35)}

/* ── DASHBOARD ── */
.dash-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.c1::before{background:linear-gradient(90deg,var(--accent),#0097a7)}
.kpi-card.c2::before{background:linear-gradient(90deg,var(--accent2),#6366f1)}
.kpi-card.c3::before{background:linear-gradient(90deg,var(--success),#16a34a)}
.kpi-card.c4::before{background:linear-gradient(90deg,var(--danger),#dc2626)}
.kpi-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin-bottom:4px}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:4px}

.dash-section{margin-bottom:24px}
.dash-section h3{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

.ctrl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ctrl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.ctrl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ctrl-card .cc-icon{font-size:26px;margin-bottom:8px}
.ctrl-card .cc-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.3}
.ctrl-card .cc-pct{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px}
.ctrl-card .cc-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ctrl-card .cc-fill{height:100%;border-radius:2px;transition:width .4s}

.detail-table{width:100%;border-collapse:collapse}
.detail-table th{background:rgba(31,45,71,.8);padding:8px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.detail-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:top}
.detail-table tr:hover td{background:rgba(255,255,255,.02)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

/* ── REPORTS ── */
.report-panel{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.rp-settings{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.rp-settings h3{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.rp-field{margin-bottom:14px}
.rp-field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;font-weight:600}
.rp-field input,.rp-field select,.rp-field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:7px;font-size:12px;font-family:inherit;outline:none;transition:border-color .2s}
.rp-field input:focus,.rp-field select:focus,.rp-field textarea:focus{border-color:var(--accent2)}
.rp-field textarea{resize:vertical;min-height:70px}

.rtype-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rtype-btn{padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;transition:all .2s}
.rtype-btn.active{border-color:var(--accent2);background:rgba(59,130,246,.08)}
.rtype-btn .rt-icon{font-size:18px;margin-bottom:5px}
.rtype-btn .rt-name{font-size:11px;font-weight:700;color:var(--text)}
.rtype-btn .rt-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}

.rp-preview{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:sticky;top:0}
.rpv-cover{background:linear-gradient(135deg,#0f2444,#1a3a6c);padding:20px}
.rpv-cover .rpc-tag{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rpv-cover .rpc-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff;margin-bottom:4px}
.rpv-cover .rpc-org{font-size:12px;color:rgba(255,255,255,.6)}
.rpv-body{padding:16px}
.rpv-stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.rpv-stat:last-child{border-bottom:none}
.rpv-stat .rs-lbl{color:var(--muted)}
.rpv-stat .rs-val{font-weight:700}
.print-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#0097a7);border:none;border-radius:8px;color:#000;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px;transition:opacity .2s}
.print-btn:hover{opacity:.9}
.print-hint{font-size:10px;color:var(--muted);text-align:center;margin-top:7px;line-height:1.5}

/* ── PRINT STYLES ── */
@media print {
  body{background:#fff!important;color:#111!important;overflow:visible!important;height:auto!important;font-family:'Segoe UI',Arial,sans-serif}
  #app{display:none!important}
  #print-area{display:block!important}
}
#print-area{display:none}

.pr{font-family:'Segoe UI',Arial,sans-serif;color:#111;background:#fff;max-width:210mm;margin:0 auto}
.pr-cover{background:linear-gradient(135deg,#0f2444,#1a3a6c);color:#fff;padding:48px 40px 36px;page-break-after:avoid}
.pr-cover .prc-flag{font-size:28px;margin-bottom:8px}
.pr-cover h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.pr-cover .prc-sub{font-size:14px;opacity:.7;margin-bottom:4px}
.pr-cover .prc-meta{font-size:11px;opacity:.45;margin-top:8px}
.pr-cover .prc-badges{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.pr-cover .prc-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)}
.pr-section{padding:22px 40px;border-bottom:1px solid #e5e7eb}
.pr-section h2{font-size:15px;font-weight:700;color:#0f2444;margin-bottom:14px;padding-bottom:7px;border-bottom:2px solid #00c2a8}
.pr-section h3{font-size:12px;font-weight:700;color:#374151;margin:14px 0 8px}
.pr-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.pr-kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;text-align:center}
.pr-kpi .pkv{font-size:22px;font-weight:800;color:#0f2444}
.pr-kpi .pkl{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.pr-table{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:8px}
.pr-table th{background:#0f2444;color:#fff;padding:7px 10px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.pr-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.4}
.pr-table tr:nth-child(even) td{background:#f8fafc}
.pr-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700}
.pr-badge.yes{background:#dcfce7;color:#166534}
.pr-badge.no{background:#fee2e2;color:#991b1b}
.pr-badge.partial{background:#fef9c3;color:#854d0e}
.pr-badge.na{background:#f1f5f9;color:#6b7280}
.pr-badge.pending{background:#ffedd5;color:#9a3412}
.pr-ctrl-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.pr-ctrl-row:last-child{border:none}
.pr-ctrl-icon{font-size:20px;min-width:26px}
.pr-ctrl-name{font-size:12px;font-weight:600;color:#0f2444;min-width:180px}
.pr-prog{flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.pr-prog .pf{height:100%;background:#00c2a8;border-radius:3px}
.pr-prog-pct{font-size:11px;font-weight:700;min-width:36px;text-align:right}
.pr-finding{padding:9px 13px;border-radius:6px;margin:5px 0;font-size:11px;line-height:1.5}
.pr-finding.critical{background:#fff1f2;border-left:4px solid #e11d48;color:#4c0519}
.pr-finding.high{background:#fff7ed;border-left:4px solid #ea580c;color:#431407}
.pr-finding.pass{background:#f0fdf4;border-left:4px solid #22c55e;color:#14532d}
.pr-footer{background:#f8fafc;padding:14px 40px;font-size:9px;color:#9ca3af;display:flex;justify-content:space-between;border-top:2px solid #00c2a8}
.pr-ref-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pr-ref-card{border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px}
.pr-ref-card .prc-title{font-size:11px;font-weight:700;color:#0f2444;margin-bottom:3px}
.pr-ref-card .prc-body{font-size:10px;color:#6b7280;line-height:1.5}
.page-break{page-break-before:always;padding-top:16px}
@page{margin:12mm 10mm;size:A4}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sid-logo">
      <div class="mark">🛡️</div>
      <div class="name-wrap">
        <div class="name">CE SA Framework</div>
        <div class="sub">v3.2 · April 2025</div>
      </div>
      <button class="collapse-btn" id="collapseBtn" onclick="toggleSidebar()">◀</button>
    </div>
    <div class="sid-progress" id="sidProgress">
      <div class="prog-label"><span>Overall Progress</span><span id="progPct">0%</span></div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="sid-nav" id="sidNav"></div>
    <div class="sid-foot" id="sidFoot">
      <div class="sid-save-row">
        <button class="sid-btn" onclick="saveProgress()">💾 Save</button>
        <label class="sid-btn">📂 Load<input type="file" accept=".json" style="display:none" onchange="loadProgress(event)"></label>
      </div>
      <div class="sid-reg">CE v3.2 · POPIA · Cybercrimes Act<br>South Africa · 5–250 Users</div>
    </div>

  answers: {},

// HELPERS
// ═══════════════════════════════════════════════════════════════
function getControl(id){ return CONTROLS.find(c=>c.id===id); }
function getAllQuestions(){ return CONTROLS.flatMap(c=>c.questions); }

function isAnswered(qid){
  const a = state.answers[qid];
  if (!a) return false;
  if (typeof a === 'string') return a.trim().length > 0;
  if (Array.isArray(a)) return a.length > 0;
  return false;
}

function controlPct(ctrl){
  const qs = ctrl.questions.filter(q=>q.req==='core');
  if (!qs.length) return 100;
  const done = qs.filter(q=>isAnswered(q.id)).length;
  return Math.round((done/qs.length)*100);
}

function overallPct(){
  const allCore = CONTROLS.flatMap(c=>c.questions.filter(q=>q.req==='core'));
  const done = allCore.filter(q=>isAnswered(q.id)).length;
  return Math.round((done/allCore.length)*100);
}

function overallAnswered(){
  return getAllQuestions().filter(q=>isAnswered(q.id)).length;
}

function overallTotal(){
  return getAllQuestions().length;
}

function complianceScore(){
  // Weighted: core=3, high=2, std=1
  let total=0, done=0;
  CONTROLS.flatMap(c=>c.questions).forEach(q=>{
    const w = q.req==='core'?3:q.req==='high'?2:1;
    total+=w;
    if(isAnswered(q.id)){
      const a=state.answers[q.id];
      if(q.type==='yesno' && a==='no') done+=0;
      else done+=w;
    }
  });
  return Math.round((done/total)*100);
}

// SIDEBAR RENDER

function renderSidebar(){
  const nav = document.getElementById('sidNav');
  let h = `<div class="nav-section">Assessment Sections</div>`;
  CONTROLS.forEach(ctrl=>{
    const pct = controlPct(ctrl);
    const active = state.view===ctrl.id && state.tab==='questions' ? 'active' : '';
    h += `<div class="nav-item ${active}" onclick="setView('${ctrl.id}','questions')">
      <span class="ni-icon">${ctrl.icon}</span>
      <span class="ni-text">${ctrl.label}</span>
      <span class="ni-pct">${pct}%</span>
    </div>
    <div class="nav-mini-bar"><div class="nav-mini-fill" style="width:${pct}%"></div></div>`;
  });
  h += `<div class="nav-section" style="margin-top:8px">Views</div>`;
  [['dashboard','📊','Dashboard'],['reports','🖨️','Reports & Export']].forEach(([id,icon,label])=>{
    const active = state.tab===id ? 'active':'';
    h += `<div class="nav-item ${active}" onclick="setView('${state.view}','${id}')">
      <span class="ni-icon">${icon}</span>
      <span class="ni-text">${label}</span>
    </div>`;
  });
  nav.innerHTML = h;

  const pct = overallPct();
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progPct').textContent = pct+'%';
}

function renderQuestions(ctrl){
  document.getElementById('topH1').textContent = ctrl.label;
  document.getElementById('topBadge').textContent = ctrl.badge;
  let h = '';

  // Section intro
  h += `<div class="section-intro">
    <h2>${ctrl.icon} ${ctrl.label}</h2>
    <p>${ctrl.intro}</p>
    <div class="sa-note">🇿🇦 SA Mapping — ${ctrl.saNote}</div>
  </div>`;

  // Progress for this control
  const pct = controlPct(ctrl);
  const coreQs = ctrl.questions.filter(q=>q.req==='core');
  const doneCoreQs = coreQs.filter(q=>isAnswered(q.id)).length;
  h += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:16px">
    <div style="flex:1">
      <div style="font-size:10px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px">Section Progress (Core Questions)</div>
      <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,${ctrl.color},${ctrl.color}99);border-radius:3px;transition:width .4s"></div></div>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:${ctrl.color}">${pct}%</div>
    <div style="font-size:11px;color:var(--muted)">${doneCoreQs}/${coreQs.length} core</div>
  </div>`;

  ctrl.questions.forEach(q => {
    const answered = isAnswered(q.id);
    const flagged = state.flags[q.id];
    h += renderQuestion(q, answered, flagged);
  });

  document.getElementById('content').innerHTML = h;
  attachAnswerListeners(ctrl);
}

function renderQuestion(q, answered, flagged){
  const reqClass = q.req==='core'?'req-core':q.req==='high'?'req-high':'req-std';
  const reqLabel = q.req==='core'?'CORE — Required':'High Priority';
  const reqShowLabel = q.req!=='std';

  let ansHtml = '';
  const ans = state.answers[q.id] || '';
  const comment = state.comments[q.id] || '';

  if(q.type==='yesno'){
    const selY = ans==='yes'?'sel-yes':'', selN=ans==='no'?'sel-no':'', selNA=ans==='na'?'sel-na':'';
    ansHtml = `<div class="ans-yesno">
      <button class="yn-btn ${selY}" data-qid="${q.id}" data-val="yes">✓ Yes</button>
      <button class="yn-btn ${selN}" data-qid="${q.id}" data-val="no">✗ No</button>
      <button class="yn-btn ${selNA}" data-qid="${q.id}" data-val="na">— N/A</button>
    </div>`;
  } else if(q.type==='notes'){
    ansHtml = `<textarea class="ans-notes" data-qid="${q.id}" placeholder="${q.placeholder||'Enter your response here...'}" rows="3">${ans}</textarea>`;
  } else if(q.type==='select'){
    const opts = q.options.map(o=>`<option value="${o}" ${ans===o?'selected':''}>${o}</option>`).join('');
    ansHtml = `<select class="ans-notes" style="cursor:pointer" data-qid="${q.id}"><option value="">— Select an option —</option>${opts}</select>`;
  } else if(q.type==='options'){
    const curSel = ans || '';
    ansHtml = `<div class="ans-options">${q.options.map(o=>`<button class="opt-btn ${curSel===o?'selected':''}" data-qid="${q.id}" data-val="${o}">${o}</button>`).join('')}</div>`;
  } else if(q.type==='multi'){
    const curSel = Array.isArray(ans) ? ans : [];
    ansHtml = `<div class="ans-multi">${q.options.map((o,i)=>{
      const chk = curSel.includes(o)?'checked':'';
      const sel = curSel.includes(o)?'selected':'';
      return `<div class="mc-opt ${sel}" data-qid="${q.id}" data-val="${o}" onclick="toggleMulti('${q.id}','${o.replace(/'/g,"\\'")}',this)">
        <input type="checkbox" ${chk} onclick="event.stopPropagation()">
        <label>${o}</label>
      </div>`;
    }).join('')}</div>`;
  }

  const saCtx = q.saContext ? `<div class="q-sa-context">${q.saContext}</div>` : '';
  const guidance = q.guidance ? `<div class="q-guidance">${q.guidance}</div>` : '';
  const flagBtnClass = flagged?'flagged':'';
  const commentHtml = flagged ? `<div class="q-comment"><textarea data-cid="${q.id}" placeholder="Add review note / action required..." rows="2">${comment}</textarea></div>` : '';

  return `<div class="q-block ${answered?'answered':''} ${flagged?'flagged':''}" id="qblock-${q.id}">
    <div class="q-header">
      <span class="q-num">${q.id}</span>
      <span class="q-text">${q.text.replace(/\n/g,'<br>')}</span>
      ${reqShowLabel?`<span class="q-req ${reqClass}">${reqLabel}</span>`:''}
    </div>
    <div class="q-body">
      ${guidance}
      ${saCtx}
      ${ansHtml}
      <div class="q-flag">
        <button class="flag-btn ${flagBtnClass}" onclick="toggleFlag('${q.id}')">⚑ ${flagged?'Flagged for review':'Flag for review'}</button>
      </div>
      ${commentHtml}
    </div>
  </div>`;
}

function attachAnswerListeners(ctrl){
  // Yes/No buttons
  document.querySelectorAll('.yn-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const {qid,val}=btn.dataset;
      state.answers[qid]=val;
      refreshBlock(qid, ctrl);
    });
  });
  // Text areas / selects
  document.querySelectorAll('.ans-notes').forEach(el=>{
    el.addEventListener('input',()=>{ state.answers[el.dataset.qid]=el.value; updateProgress(); });
    el.addEventListener('change',()=>{ state.answers[el.dataset.qid]=el.value; updateProgress(); });
  });
  // Option buttons
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const {qid,val}=btn.dataset;
      state.answers[qid]=val;
      refreshBlock(qid, ctrl);
    });
  });
  // Comment textareas
  document.querySelectorAll('[data-cid]').forEach(el=>{
    el.addEventListener('input',()=>{ state.comments[el.dataset.cid]=el.value; });
  });
}

function toggleMulti(qid, val, el){
  if(!Array.isArray(state.answers[qid])) state.answers[qid]=[];
  const arr = state.answers[qid];
  const idx = arr.indexOf(val);
  if(idx>=0){ arr.splice(idx,1); el.classList.remove('selected'); el.querySelector('input').checked=false; }
  else { arr.push(val); el.classList.add('selected'); el.querySelector('input').checked=true; }
  updateProgress();
}

function refreshBlock(qid, ctrl){
  updateProgress();
  const block = document.getElementById('qblock-'+qid);
  if(!block) return;
  block.classList.toggle('answered', isAnswered(qid));
  // Re-render just the answer portion
  const q = ctrl.questions.find(q=>q.id===qid);
  if(!q) return;
  const ans = state.answers[qid]||'';
  if(q.type==='yesno'){
    block.querySelectorAll('.yn-btn').forEach(b=>{
      b.className='yn-btn'+(ans===b.dataset.val?' sel-'+ans:'');
    });
  } else if(q.type==='options'){
    block.querySelectorAll('.opt-btn').forEach(b=>{
      b.className='opt-btn'+(ans===b.dataset.val?' selected':'');
    });
  }
}

function toggleFlag(qid){
  state.flags[qid] = !state.flags[qid];
  const ctrl = CONTROLS.find(c=>c.questions.some(q=>q.id===qid));
  if(ctrl) renderQuestions(ctrl);
}

function updateProgress(){
  renderSidebar();
}

  const total = overallTotal();
  const flagCount = Object.values(state.flags).filter(Boolean).length;

  const scoreRating = score>=80?{l:'Ready for Certification',c:'var(--success)'}:score>=50?{l:'In Progress',c:'var(--warn)'}:{l:'Needs Attention',c:'var(--danger)'};

  let h = `<div class="view-tabs">

  h += `<div class="dash-kpis">
    <div class="kpi-card c1"><div class="kpi-val" style="color:var(--accent)">${pct}%</div><div class="kpi-lbl">Overall Progress</div><div class="kpi-sub">${answered} of ${total} questions answered</div></div>
    <div class="kpi-card c2"><div class="kpi-val" style="color:${scoreRating.c}">${score}%</div><div class="kpi-lbl">Compliance Score</div><div class="kpi-sub">${scoreRating.l}</div></div>
    <div class="kpi-card c3"><div class="kpi-val" style="color:var(--success)">${CONTROLS.filter(c=>controlPct(c)===100).length}/${CONTROLS.length}</div><div class="kpi-lbl">Controls Complete</div><div class="kpi-sub">All core questions answered</div></div>
    <div class="kpi-card c4"><div class="kpi-val" style="color:${flagCount>0?'var(--warn)':'var(--muted)'}">${flagCount}</div><div class="kpi-lbl">Flagged Items</div><div class="kpi-sub">Require review or action</div></div>
  </div>`;

  // Control cards
  h += `<div class="dash-section"><h3>Controls Summary</h3><div class="ctrl-grid">`;
  CONTROLS.forEach(ctrl=>{
    const p = controlPct(ctrl);
    h += `<div class="ctrl-card" onclick="setView('${ctrl.id}','questions')">
      <div class="cc-icon">${ctrl.icon}</div>
      <div class="cc-name">${ctrl.label}</div>
      <div class="cc-pct" style="color:${ctrl.color}">${p}%</div>
      <div class="cc-bar"><div class="cc-fill" style="width:${p}%;background:${ctrl.color}"></div></div>
    </div>`;
  });
  h += `</div></div>`;

  // Gaps — unanswered core
  const gaps = CONTROLS.flatMap(c=>c.questions.filter(q=>q.req==='core'&&!isAnswered(q.id)).map(q=>({...q,ctrlLabel:c.label,ctrlColor:c.color})));
  if(gaps.length){
    h += `<div class="dash-section"><h3>⚠️ Outstanding Core Requirements (${gaps.length})</h3>
    <table class="detail-table"><thead><tr><th>ID</th><th>Control</th><th>Question</th><th>Status</th></tr></thead><tbody>`;
    gaps.slice(0,15).forEach(q=>{
      h+=`<tr><td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)">${q.id}</td><td style="color:${q.ctrlColor};font-size:11px">${q.ctrlLabel}</td><td style="max-width:400px">${q.text.replace(/\n/g,' ').substring(0,100)}…</td><td><span class="pr-badge pending">Pending</span></td></tr>`;
    });
    if(gaps.length>15) h+=`<tr><td colspan="4" style="color:var(--muted);font-size:11px;text-align:center">…and ${gaps.length-15} more</td></tr>`;
    h+='</tbody></table></div>';
  }

  // No answers flagged
  const noAnswers = CONTROLS.flatMap(c=>c.questions.filter(q=>q.type==='yesno'&&state.answers[q.id]==='no'));
  if(noAnswers.length){
    h += `<div class="dash-section"><h3>🔴 "No" Answers — Remediation Required (${noAnswers.length})</h3>
    <table class="detail-table"><thead><tr><th>ID</th><th>Question</th><th>SA Guidance</th></tr></thead><tbody>`;
    noAnswers.forEach(q=>{
      h+=`<tr><td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--danger)">${q.id}</td><td style="max-width:300px">${q.text.replace(/\n/g,' ').substring(0,90)}…</td><td style="font-size:11px;color:var(--muted)">${(q.saContext||'').substring(0,100)}…</td></tr>`;
    });
    h+='</tbody></table></div>';
  }

  document.getElementById('content').innerHTML = h;
}

  setTimeout(()=>{ document.getElementById('print-area').innerHTML=''; }, 1500);
}

function buildReport(){
  const today = new Date().toLocaleDateString('en-ZA',{year:'numeric',month:'long',day:'numeric'});
  const org = state.orgName||'Your Organisation';
  const contact = state.orgContact||'';
  const tier = document.getElementById('tierSelect')?.selectedOptions[0]?.text || '';
  const pct = overallPct(), score = complianceScore();
  const scoreRating = score>=80?'Ready for Certification':score>=50?'Partially Compliant':'Remediation Required';
  const rt = state.reportType;

  const noAns = CONTROLS.flatMap(c=>c.questions.filter(q=>q.type==='yesno'&&state.answers[q.id]==='no').map(q=>({...q,ctrlLabel:c.label})));
  const gaps = CONTROLS.flatMap(c=>c.questions.filter(q=>q.req==='core'&&!isAnswered(q.id)).map(q=>({...q,ctrlLabel:c.label})));

  let html = `<div class="pr">
  <div class="pr-cover">
    <div class="prc-flag">🇿🇦</div>
    <h1>Cyber Essentials SA — ${rt==='executive'?'Executive Summary':rt==='gap'?'Gap Analysis Report':rt==='full'?'Full Assessment Report':'Board Compliance Report'}</h1>
    <div class="prc-sub">${org}${contact?' · '+contact:''}</div>
    <div class="prc-meta">CE Framework v3.2 (April 2025) · ${tier} · Generated: ${today}</div>
    <div class="prc-badges">
      <span class="prc-badge">POPIA Act 4 of 2013</span>
      <span class="prc-badge">Cybercrimes Act 19 of 2020</span>
      <span class="prc-badge">5 CE Technical Controls</span>
      <span class="prc-badge">${scoreRating}</span>
    </div>
  </div>`;

  // KPI section
  html += `<div class="pr-section"><h2>Assessment Summary</h2>
    <div class="pr-kpi-row">
      <div class="pr-kpi"><div class="pkv">${pct}%</div><div class="pkl">Overall Progress</div></div>
      <div class="pr-kpi"><div class="pkv" style="color:${score>=80?'#166534':score>=50?'#854d0e':'#991b1b'}">${score}%</div><div class="pkl">Compliance Score</div></div>
      <div class="pr-kpi"><div class="pkv">${overallAnswered()}/${overallTotal()}</div><div class="pkl">Questions Answered</div></div>
      <div class="pr-kpi"><div class="pkv">${CONTROLS.filter(c=>controlPct(c)===100).length}/${CONTROLS.length}</div><div class="pkl">Controls Complete</div></div>
    </div>`;

  // Control progress bars
  html += `<h3>Control-by-Control Progress</h3>`;
  CONTROLS.forEach(ctrl=>{
    const p = controlPct(ctrl);
    html += `<div class="pr-ctrl-row">
      <div class="pr-ctrl-icon">${ctrl.icon}</div>
      <div class="pr-ctrl-name">${ctrl.label} <span style="font-size:9px;font-weight:400;color:#6b7280">(${ctrl.badge})</span></div>
      <div class="pr-prog"><div class="pf" style="width:${p}%"></div></div>
      <div class="pr-prog-pct" style="color:${p===100?'#166534':p>=50?'#854d0e':'#991b1b'}">${p}%</div>
    </div>`;
  });

  if(state.reportNotes){ html += `<h3>Information Officer Notes</h3><div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-size:11px;color:#374151;white-space:pre-wrap;margin-top:6px">${state.reportNotes}</div>`; }
  html += `</div>`;

  if(rt==='executive'||rt==='board'){
    // Key findings
    html += `<div class="pr-section"><h2>Key Findings</h2>`;
    if(noAns.length){
      html += `<h3>Non-Compliant Responses (${noAns.length} "No" answers)</h3>`;
      noAns.forEach(q=>{
        html += `<div class="pr-finding critical"><strong>${q.id} — ${q.ctrlLabel}:</strong> ${q.text.replace(/\n/g,' ').substring(0,120)}</div>`;
      });
    }
    if(gaps.length){
      html += `<h3>Unanswered Core Requirements (${gaps.length})</h3>`;
      gaps.slice(0,10).forEach(q=>{
        html += `<div class="pr-finding high"><strong>${q.id} — ${q.ctrlLabel}:</strong> ${q.text.replace(/\n/g,' ').substring(0,120)}</div>`;
      });
    }
    const passCount = CONTROLS.flatMap(c=>c.questions.filter(q=>q.type==='yesno'&&state.answers[q.id]==='yes')).length;
    if(passCount){ html += `<div class="pr-finding pass"><strong>✓ ${passCount} requirements confirmed compliant</strong> — positive yes/no responses recorded.</div>`; }
    html += `</div>`;

    if(rt==='board'){
      html += `<div class="pr-section page-break"><h2>SA Regulatory Context</h2>
        <div class="pr-ref-grid">
          <div class="pr-ref-card"><div class="prc-title">POPIA — Act 4 of 2013</div><div class="prc-body">Section 19 requires responsible parties to secure personal information against compromise. Cyber Essentials controls directly satisfy these technical safeguard requirements. Information Regulator: inforeg@justice.gov.za</div></div>
          <div class="pr-ref-card"><div class="prc-title">Cybercrimes Act — Act 19 of 2020</div><div class="prc-body">Criminalises cyber attacks, data breaches and system intrusions. Organisations must report cybercrime to SAPS. CE controls reduce susceptibility to the attacks covered by this Act.</div></div>
          <div class="pr-ref-card"><div class="prc-title">FSCA Guidance Note 3 of 2021</div><div class="prc-body">Requires financial service providers to implement cybersecurity frameworks. CE provides the minimum technical baseline. MFA, patching and access control are explicitly required.</div></div>
          <div class="pr-ref-card"><div class="prc-title">SARB Prudential Standard CPS 234</div><div class="prc-body">Applies to banks and insurers. Requires information security capabilities commensurate with the size and extent of threats. CE is an accepted baseline for smaller regulated entities.</div></div>
        </div></div>`;
    }
  }

  if(rt==='gap'){
    CONTROLS.forEach((ctrl,ci)=>{
      const gapQs = ctrl.questions.filter(q=>!isAnswered(q.id)||state.answers[q.id]==='no');
      if(!gapQs.length) return;
      html += `<div class="pr-section ${ci>0?'page-break':''}"><h2>${ctrl.icon} ${ctrl.label} — Gaps (${gapQs.length})</h2>
        <table class="pr-table">
          <tr><th>ID</th><th>Question</th><th>Status</th><th>SA Context</th></tr>`;
      gapQs.forEach(q=>{
        const ans = state.answers[q.id];
        const status = !isAnswered(q.id)?'Pending':ans==='no'?'Non-Compliant':'';
        const badgeClass = status==='Pending'?'pending':'no';
        html += `<tr><td style="font-family:monospace;font-size:9px">${q.id}</td><td>${q.text.replace(/\n/g,' ').substring(0,100)}</td><td><span class="pr-badge ${badgeClass}">${status}</span></td><td style="font-size:9px;color:#6b7280">${(q.saContext||'').substring(0,80)}</td></tr>`;
      });
      html += `</table></div>`;
    });
  }

  if(rt==='full'){
    CONTROLS.forEach((ctrl,ci)=>{
      html += `<div class="pr-section ${ci>0?'page-break':''}"><h2>${ctrl.icon} ${ctrl.label}</h2>
        <table class="pr-table">
          <tr><th>ID</th><th>Question</th><th>Answer / Response</th><th>Status</th></tr>`;
      ctrl.questions.forEach(q=>{
        const ans = state.answers[q.id];
        let ansDisplay = '';
        if(!ans||ans===''||( Array.isArray(ans)&&!ans.length)){ ansDisplay='<em style="color:#9ca3af">Not answered</em>'; }
        else if(q.type==='yesno'){ ansDisplay=`<span class="pr-badge ${ans}">${ans.toUpperCase()}</span>`; }
        else if(Array.isArray(ans)){ ansDisplay=ans.join(', '); }
        else{ ansDisplay=String(ans).substring(0,120); }
        const status = !isAnswered(q.id)?'pending':q.type==='yesno'&&ans==='no'?'no':q.type==='yesno'&&ans==='yes'?'yes':q.type==='yesno'&&ans==='na'?'na':'yes';
        html += `<tr><td style="font-family:monospace;font-size:9px">${q.id}</td><td style="${isAnswered(q.id)?'':'color:#9ca3af'}">${q.text.replace(/\n/g,' ').substring(0,100)}</td><td style="font-size:10px">${ansDisplay}</td><td><span class="pr-badge ${status}">${status==='pending'?'Pending':status.toUpperCase()}</span></td></tr>`;
      });
      html += `</table></div>`;
    });
  }

  // Footer + NCSC refs
  html += `<div class="pr-footer">
    <span>${org} · CE Self-Assessment v3.2 · ${tier}</span>
    <span>Generated: ${today} · NCSC: ncsc.gov.uk/cyberessentials · Info Regulator SA: justice.gov.za/inforeg</span>
  </div></div>`;

  return html;
}

function setView(ctrlId, tab){
  state.view = ctrlId;
  state.tab = tab;
  renderSidebar();
  if(tab==='questions'){
    const ctrl = getControl(ctrlId);
    if(ctrl) renderQuestions(ctrl);
  } else if(tab==='dashboard'){
    renderDashboard();
  } else if(tab==='reports'){
    renderReports();
  }
  document.getElementById('content').scrollTop=0;
}

function setTier(v){ state.tier=v; }

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('collapseBtn');
  const isCollapsed = sb.classList.toggle('collapsed');
  btn.textContent = isCollapsed ? '▶' : '◀';
  ['sidProgress','sidFoot'].forEach(id=>{
    document.getElementById(id).style.display = isCollapsed?'none':'';
  });
  document.querySelectorAll('.nav-section,.ni-text,.ni-pct,.nav-mini-bar,.name-wrap').forEach(el=>{
    el.style.display = isCollapsed?'none':'';
  });
}

function saveProgress(){
  const data = {
    answers: state.answers, flags: state.flags, comments: state.comments,
    orgName: state.orgName, orgContact: state.orgContact, reportNotes: state.reportNotes,
    tier: state.tier, savedAt: new Date().toISOString(), version:'CE-SA-v3.2'
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CE-SA-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

function loadProgress(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const d = JSON.parse(ev.target.result);
      if(d.answers) state.answers=d.answers;
      if(d.flags) state.flags=d.flags;
      if(d.comments) state.comments=d.comments;
      if(d.orgName) state.orgName=d.orgName;
      if(d.orgContact) state.orgContact=d.orgContact;
      if(d.reportNotes) state.reportNotes=d.reportNotes;
      setView(state.view, state.tab);
    } catch(e){ alert('Could not read file. Please load a valid CE-SA progress file.'); }
  };
  reader.readAsText(file);
  event.target.value='';
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', ()=>{
  renderSidebar();
  setView('org','questions');
});
</script>
